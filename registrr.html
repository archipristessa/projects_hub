<!-- ===== REGISTRATION PAGE ===== -->
<!-- Страница регистрации для проектной платформы ГУУ -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== MAIN CONTAINER ===== -->
    <div class="registration-container">
        
        <!-- ===== LEFT PANEL ===== -->
        <!-- Боковая панель с брендингом платформы -->
        <div class="left-panel">
            <button class="back-arrow" onclick="goToMainPage()">
                <svg viewBox="0 0 24 24">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>
            

            <!-- <div class="university-name">Государственный Университет Управления</div>
            <div class="logo-container">
                <img src="images/Alina_logo_1.png" alt="Логотип платформы" class="logo">
            </div>
            <div class="slogan">Найди тему проекта и команду в ГУУ</div> -->

            <div class="logo-container">
                <img src="images/Alina_logo_1.png" alt="Логотип ГУУ" class="logo">
            </div>
            <div class="slogan">Найди тему проекта и команду в ГУУ</div>
        </div>
        
        <!-- ===== RIGHT PANEL ===== -->
        <!-- Панель с формой регистрации -->
        <div class="right-panel">
            <div class="right-panel-content">
                <form class="registration-form">
                    <h1>Регистрация</h1>
                    
                    <div class="form-group">
                        <div class="name-fields">
                            <div class="name-field">
                                <label for="lastname">Фамилия*</label>
                                <input type="text" id="lastname" placeholder="Введите фамилию" required>
                            </div>
                            <div class="name-field">
                                <label for="firstname">Имя*</label>
                                <input type="text" id="firstname" placeholder="Введите имя" required>
                            </div>
                            <div class="name-field">
                                <label for="middlename">Отчество</label>
                                <input type="text" id="middlename" placeholder="Введите отчество">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-mail*</label>
                        <input type="email" id="email" placeholder="Введите e-mail" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Пароль*</label>
                        <input type="password" id="password" placeholder="Введите пароль" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Подтверждение пароля*</label>
                        <input type="password" id="confirm-password" placeholder="Повторите пароль" required>
                        <div class="password-error" id="password-error">Пароли не совпадают</div>
                    </div>
                    
                    <div class="form-group">
                        <div class="role-question">Кто Вы?*</div>
                        <div class="role-selection">
                            <div class="role-option" onclick="selectRole('student')">
                                <input type="radio" id="student" name="role" value="student">
                                <label for="student">Студент</label>
                            </div>
                            <div class="role-option" onclick="selectRole('teacher')">
                                <input type="radio" id="teacher" name="role" value="teacher">
                                <label for="teacher">Преподаватель</label>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn">продолжить</button>
                    
                    <div class="login-link">
                        Уже есть доступ? <a href="login.html">Войдите</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="registration_script.js"></script>
</body>
</html>
